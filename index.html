<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D² Print Studio — Catalog</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0d0f; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #2a2a2f; border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</helmet>

<div style="min-height: 100vh; background: #0d0d0f; color: #f2f2f0; font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;">

  <!-- NAV -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding: 18px 32px; border-bottom: 1px solid #232326; position:sticky; top:0; background:rgba(13,13,15,0.92); backdrop-filter: blur(8px); z-index:50; height:36px;">
    <a href="/index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.02em;">3D<span style="color: oklch(0.7 0.16 25);">²</span></div>
      <div style="font-size:12px; color:#8a8a90; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;">print studio</div>
    </a>
    <div style="display:flex; align-items:center; gap:24px;">
      <a href="/index.html" style="font-size:14px; color:#c9c9cd; text-decoration:none;">Catalog</a>
      <a href="/staff.html" style="font-size:14px; color:#c9c9cd; text-decoration:none; border:1px solid #2e2e32; padding:8px 16px; border-radius:6px;">Staff Login</a>
    </div>
  </div>

  <!-- CATALOG -->
  <div style="max-width:1320px; margin:0 auto; padding:56px 32px 96px;">
    <div style="max-width:640px; margin-bottom:48px;">
      <div style="font-family:'Space Grotesk',sans-serif; font-size:40px; font-weight:600; line-height:1.15; letter-spacing:-0.01em;">Custom 3D printing, made simple.</div>
      <div style="font-size:16px; color:#9a9aa0; margin-top:14px; line-height:1.6;">Design your piece, preview it in real time, and we print it on-demand. Prices shown are starting points in INR.</div>
    </div>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:20px;">
      <sc-for list="{{ catalogItems }}" as="item" hint-placeholder-count="7">
        <div style="background:#151517; border:1px solid #232326; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; transition: border-color 0.15s;">
          <sc-if value="{{ item.hasPhoto }}" hint-placeholder-val="{{ false }}">
            <div style="height:180px; background:#101012;">
              <img src="{{ item.photoUrl }}" style="width:100%; height:100%; object-fit:cover; display:block;"/>
            </div>
          </sc-if>
          <sc-if value="{{ item.hasNoPhoto }}" hint-placeholder-val="{{ true }}">
            <div style="height:180px; background: repeating-linear-gradient(45deg, #1c1c1f, #1c1c1f 10px, #202023 10px, #202023 20px); display:flex; align-items:center; justify-content:center;">
              <div style="font-family:'Courier New',monospace; font-size:12px; color:#6b6b72; letter-spacing:0.04em;">{{ item.photoLabel }}</div>
            </div>
          </sc-if>
          <div style="padding:20px; display:flex; flex-direction:column; gap:10px; flex:1;">
            <div style="font-size:16px; font-weight:600;">{{ item.name }}</div>
            <div style="font-size:13px; color:#8a8a90; line-height:1.5; flex:1;">{{ item.desc }}</div>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
              <div style="font-size:15px; font-weight:600; color: oklch(0.72 0.16 25);">{{ item.price }}</div>
              <a href="{{ item.href }}" style="background: oklch(0.7 0.16 25); color:#161616; border:none; padding:9px 16px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none;">{{ item.cta }}</a>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = {};

  renderVals() {
    const catalogItems = [
      { name: 'Custom Keychain', price: 'From ₹180', cta: 'Customize', href: '/keychain.html', photoLabel: 'PRODUCT PHOTO — KEYCHAIN', hasPhoto: false, hasNoPhoto: true, desc: 'Engrave any name or word — pick a font, size and colors.' },
      { name: 'Custom Bookmark', price: '₹200', cta: 'Customize', href: '/bookmark.html', photoUrl: '/uploads/bookmark.jpeg', hasPhoto: true, hasNoPhoto: false, desc: 'Engrave any name or word, pick colors — or describe a custom shape.' },
      { name: 'Keycap Fidget Toy', price: 'From ₹300', cta: 'Customize', href: '/keycap.html', photoLabel: 'PRODUCT PHOTO — KEYCAP FIDGET', hasPhoto: false, hasNoPhoto: true, desc: 'A row of clicky keycaps in a housing — one per letter of a name or word.' },
      { name: 'PS5 Controller / Holder', price: 'From ₹300', cta: 'Order now', href: '/ps5.html', photoUrl: '/uploads/ps5-holder.webp', hasPhoto: true, hasNoPhoto: false, desc: 'Sturdy stand for controller, sized for standard PS5 controllers. Final price depends on design complexity.' },
      { name: 'Action Figures / Mini Figures', price: 'From ₹250', cta: 'Order now', href: '/figurine.html', photoLabel: 'PRODUCT PHOTO — FIGURINE', hasPhoto: false, hasNoPhoto: true, desc: 'Custom mini figures — describe the character, colors and size.' },
      { name: 'Custom Logos', price: 'From ₹200', cta: 'Order now', href: '/logo.html', photoUrl: '/uploads/manchester-united-logo.jpeg', hasPhoto: true, hasNoPhoto: false, desc: 'Any logo or brand mark, printed on a keychain, plaque or board.' },
      { name: 'Something else?', price: 'Custom quote', cta: 'Describe your idea', href: '/other.html', photoLabel: 'PRODUCT PHOTO — YOUR IDEA', hasPhoto: false, hasNoPhoto: true, desc: "Don't see what you need — tell us what you'd like printed." },
    ];
    return { catalogItems };
  }
}

</script>
</body>
</html>
